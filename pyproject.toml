# Tool configuration only. Coldwriter is not a Python package: the scripts are
# stdlib-only and run under whatever python3 the user has, 3.9 or newer.

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
