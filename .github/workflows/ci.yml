name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Only `claude plugin validate` is used; it is a local static check and needs no login.
      - run: npm install -g @anthropic-ai/claude-code
      - run: make check
